
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Available</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #071426, #123c68, #071426);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 25px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            margin-bottom: 28px;
            border-radius: 50px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(38px, 8vw, 100px);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        h1 span {
            display: block;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        p {
            max-width: 600px;
            margin-top: 25px;
            color: #d1dbea;
            font-size: clamp(15px, 2vw, 20px);
            line-height: 1.7;
        }

        .line {
            width: 100px;
            height: 5px;
            margin-top: 30px;
            border-radius: 10px;
            background: linear-gradient(90deg, #38bdf8, #4ade80);
        }

        footer {
            margin-top: 35px;
            color: #9caec4;
            font-size: 13px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .container {
                min-height: 350px;
                padding: 40px 18px;
                border-radius: 18px;
            }

            .status {
                font-size: 12px;
                padding: 9px 14px;
                letter-spacing: 1px;
            }

            h1 {
                letter-spacing: -1px;
            }

            p {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="status">● WEBSITE STATUS: ACTIVE</div>

        <h1>
            PAGE
            <span>AVAILABLE</span>
        </h1>

        <p>
            This page is available and ready to use.
            Thank you for visiting our website.
        </p>

        <div class="line"></div>

        <footer>
            © 2026 ALL RIGHTS RESERVED
        </footer>

    </main>

</body>
</html>
